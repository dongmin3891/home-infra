apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-r2-backup
  namespace: database
spec:
  schedule: "17 3 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: backup
              emptyDir: {}
          initContainers:
            - name: dump
              image: postgres:18.6-alpine
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: postgres-admin
              command:
                - sh
                - -ec
                - |
                  TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
                  export PGPASSWORD="${POSTGRES_PASSWORD}"

                  echo "=== Backup start: ${TIMESTAMP} ==="

                  pg_dump \
                    --host=postgres \
                    --port=5432 \
                    --username="${POSTGRES_USER}" \
                    --dbname=iwtc \
                    --format=custom \
                    --no-owner \
                    --no-acl \
                    --file="/backup/iwtc-${TIMESTAMP}.dump"

                  pg_dump \
                    --host=postgres \
                    --port=5432 \
                    --username="${POSTGRES_USER}" \
                    --dbname=ddongmy \
                    --format=custom \
                    --no-owner \
                    --no-acl \
                    --file="/backup/ddongmy-${TIMESTAMP}.dump"

                  pg_dumpall \
                    --host=postgres \
                    --port=5432 \
                    --username="${POSTGRES_USER}" \
                    --globals-only \
                    | gzip > "/backup/globals-${TIMESTAMP}.sql.gz"

                  sha256sum \
                    "/backup/iwtc-${TIMESTAMP}.dump" \
                    "/backup/ddongmy-${TIMESTAMP}.dump" \
                    "/backup/globals-${TIMESTAMP}.sql.gz" \
                    > /backup/SHA256SUMS

                  echo "${TIMESTAMP}" > /backup/timestamp
                  ls -lh /backup
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: amazon/aws-cli:latest
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: postgres-backup-r2
              command:
                - sh
                - -ec
                - |
                  TIMESTAMP="$(cat /backup/timestamp)"
                  YEAR="$(echo "$TIMESTAMP" | cut -c1-4)"
                  MONTH="$(echo "$TIMESTAMP" | cut -c5-6)"
                  DAY="$(echo "$TIMESTAMP" | cut -c7-8)"

                  TARGET="s3://${R2_BUCKET}/postgres/daily/${YEAR}/${MONTH}/${DAY}"

                  echo "Uploading to ${TARGET}"

                  aws \
                    --endpoint-url="${R2_ENDPOINT}" \
                    s3 cp /backup/ "${TARGET}/" \
                    --recursive \
                    --no-progress

                  echo
                  echo "=== Uploaded ==="

                  aws \
                    --endpoint-url="${R2_ENDPOINT}" \
                    s3 ls "${TARGET}/"
              volumeMounts:
                - name: backup
                  mountPath: /backup
